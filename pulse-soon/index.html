<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульс КЦ — скоро запуск</title>
<meta name="description" content="Пульс КЦ — дашборд колл-центра для Битрикс24: звонки, пропущенные, статусы операторов и просроченные дела в реальном времени.">
<meta name="theme-color" content="#0A0F1E">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: Unbounded; font-weight: 600; font-display: swap; src: url(/assets/unbounded-cyrillic-600.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: Unbounded; font-weight: 600; font-display: swap; src: url(/assets/unbounded-latin-600.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
@font-face { font-family: Manrope; font-weight: 400; font-display: swap; src: url(/assets/manrope-cyrillic-400.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: Manrope; font-weight: 400; font-display: swap; src: url(/assets/manrope-latin-400.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
*{box-sizing:border-box}
html,body{margin:0;background:#0A0F1E;color:#E9EEF8;font-family:Manrope,system-ui,sans-serif}
main{min-height:100vh;max-width:880px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;justify-content:center;gap:28px;position:relative}
main::before{content:'';position:absolute;left:-200px;top:10%;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(47,198,246,.14),transparent 65%);pointer-events:none}
img{display:block;width:260px;height:auto;position:relative}
h1{margin:0;font-family:Unbounded,system-ui,sans-serif;font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1.1;letter-spacing:-.03em;position:relative}
p{margin:0;font-size:18px;line-height:1.6;color:#8F9BB7;max-width:600px;position:relative}
a{color:#2FC6F6;text-decoration:none;font-weight:600}
a:hover{color:#7DE3FF}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font-size:13px;color:#C3CADB;border:1px solid rgba(255,255,255,.12);padding:8px 14px;border-radius:99px;position:relative}
.pill::before{content:'';width:7px;height:7px;border-radius:99px;background:#2FC6F6}
</style>
</head>
<body>
<main>
  <img src="/assets/pulse-logo.svg" alt="Пульс КЦ" width="260" height="45">
  <span class="pill">Скоро запуск</span>
  <h1>Дашборд колл-центра для Битрикс24</h1>
  <p>Звонки, пропущенные, статусы операторов и просроченные дела — в реальном времени. Готовим к запуску.</p>
  <p><a href="https://unosystem.ru">← Все продукты Uno System</a></p>
</main>
</body>
</html>
